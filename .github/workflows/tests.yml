name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.45.3'
            testbench: '^9.15'
            phpunit: '^11.5'
          - php: '8.3'
            laravel: '^12.41.1'
            testbench: '^10.6'
            phpunit: '^12.0'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10.2
      # Laravel 11 is outside security support. These reviewed exceptions only
      # permit isolated compatibility tests; audit reporting remains enabled.
      - name: Configure Laravel 11 compatibility exceptions
        if: startsWith(matrix.laravel, '^11.')
        run: |
          composer config --json policy.advisories.ignore-id '{
            "PKSA-d5tc-s1qs-h781": {"on-block": true, "on-audit": false, "reason": "CI-only Laravel 11 compatibility test; security support ended 2026-03-12."},
            "PKSA-m5cs-t1y6-qpcs": {"on-block": true, "on-audit": false, "reason": "CI-only Laravel 11 compatibility test; security support ended 2026-03-12."},
            "PKSA-3r5d-mb8f-1qw9": {"on-block": true, "on-audit": false, "reason": "CI-only Laravel 11 compatibility test; security support ended 2026-03-12."},
            "PKSA-mdq4-51ck-6kdq": {"on-block": true, "on-audit": false, "reason": "CI-only Laravel 11 compatibility test; security support ended 2026-03-12."}
          }'
      - name: Install matrix dependencies
        env:
          COMPOSER_NO_AUDIT: '0'
        run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-progress
      - run: composer check
